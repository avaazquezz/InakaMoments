# ─────────────────────────────────────────────────────────────────────────────
# Inaka Moments — DESARROLLO (por defecto)
#
#   docker compose up          → http://localhost:3000 con hot reload
#   docker compose down        → parar
#   docker compose down -v     → parar y reinstalar deps limpias la próxima vez
#
# El código se monta desde el host; node_modules/.nuxt/.output viven en
# volúmenes del contenedor (no ensucian tu working copy con ficheros de root).
# Las dependencias solo se reinstalan si cambió package-lock.json.
# Producción: docker compose -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────
services:
  app:
    image: node:22-alpine
    container_name: inaka-moments-dev
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        if ! cmp -s package-lock.json node_modules/.cached-lock.json 2>/dev/null; then
          echo "Instalando dependencias (package-lock.json cambio)..."
          npm ci
          cp package-lock.json node_modules/.cached-lock.json
        fi
        exec npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nuxt_cache:/app/.nuxt
      - nitro_output:/app/.output
    environment:
      - NODE_ENV=development
      - NUXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env
        required: false
    init: true
    restart: unless-stopped

volumes:
  node_modules:
  nuxt_cache:
  nitro_output:
