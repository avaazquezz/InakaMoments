# ─────────────────────────────────────────────────────────────────────────────
# Inaka Moments — DESARROLLO (hot reload, sin Traefik)
#
# Uso (desde inaka-moments/):
#   docker compose -f docker/docker-compose.dev.yml up
#   → http://localhost:3000
#
# El código se monta como volumen; node_modules vive en un volumen propio del
# contenedor (evita pisar los del host y acelera el filesystem).
# ─────────────────────────────────────────────────────────────────────────────
services:
  inaka-moments-dev:
    image: node:22-alpine
    container_name: inaka-moments-dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      # Directorios generados en volúmenes propios: no pisan los del host
      # ni dejan ficheros propiedad de root en tu working copy.
      - node_modules:/app/node_modules
      - nuxt_cache:/app/.nuxt
      - nitro_output:/app/.output
    environment:
      - NODE_ENV=development
      - NUXT_TELEMETRY_DISABLED=1
    env_file:
      - path: ../.env
        required: false
    init: true
    restart: unless-stopped

volumes:
  node_modules:
  nuxt_cache:
  nitro_output:
