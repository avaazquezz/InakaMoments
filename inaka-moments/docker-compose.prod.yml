# ─────────────────────────────────────────────────────────────────────────────
# Inaka Moments — PRODUCCIÓN (detrás de Traefik con TLS Let's Encrypt)
#
# En el VPS (una sola vez):  docker network create web
# Desplegar:                 docker compose -f docker-compose.prod.yml up -d --build
#
# Variables de entorno: .env.production junto a este fichero (ver .env.example).
# El panel /admin es una RUTA de la misma app: no necesita router propio.
# Guía completa: docker/DEPLOY.md
# ─────────────────────────────────────────────────────────────────────────────
services:
  app:
    image: inaka-moments:latest
    container_name: inaka-moments
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true # reaping de señales/zombies correcto con node como proceso principal
    env_file:
      - path: .env.production
        required: false # en el VPS puede inyectarse el entorno por otros medios
    environment:
      # Nuxt solo mapea variables NUXT_* sobre runtimeConfig en runtime (la
      # imagen se construye SIN secretos). Puenteamos las canónicas del .env:
      - NUXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-}
      - NUXT_PUBLIC_SUPABASE_KEY=${SUPABASE_KEY:-}
      - NUXT_SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
    networks:
      - web
    labels:
      - "traefik.enable=true"

      # Router principal: apex + www por HTTPS
      - "traefik.http.routers.inaka.rule=Host(`inakamoments.com`) || Host(`www.inakamoments.com`)"
      - "traefik.http.routers.inaka.entrypoints=websecure"
      - "traefik.http.routers.inaka.tls=true"
      - "traefik.http.routers.inaka.tls.certresolver=le"
      - "traefik.http.routers.inaka.middlewares=inaka-www-redirect,inaka-headers"
      - "traefik.http.services.inaka.loadbalancer.server.port=3000"

      # www → apex
      - "traefik.http.middlewares.inaka-www-redirect.redirectregex.regex=^https?://www\\.inakamoments\\.com/(.*)"
      - "traefik.http.middlewares.inaka-www-redirect.redirectregex.replacement=https://inakamoments.com/$${1}"
      - "traefik.http.middlewares.inaka-www-redirect.redirectregex.permanent=true"

      # Cabeceras de seguridad (CSP fina se añade en Fase 8, cuando el set de
      # dominios externos —Supabase, Stripe, Turnstile— esté cerrado)
      - "traefik.http.middlewares.inaka-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.inaka-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.inaka-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.inaka-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.inaka-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.inaka-headers.headers.frameDeny=true"

networks:
  web:
    external: true
